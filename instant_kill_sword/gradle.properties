# Mod info
mod_id=instakill
mod_name=测试剑
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.example.instakill
mod_authors=you
mod_description=外观等同原版钻石剑的"测试剑"。四种模式（改血量=0 / die() / remove() / NBTkill()）用 Shift + 右键循环切换；普通右键对渲染范围内所有实体执行当前模式。NBTkill() 会复制实体 NBT、清空血量与背包及状态后强行覆写。模式保存在剑的 NBT 中，并带弱引用清理防止内存泄露。
