name: Build Mod Jar 111

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check repo layout
        run: |
          pwd
          ls -la
          for f in build.gradle settings.gradle gradle.properties src/main/java src/main/resources; do
            [ -e "$f" ] && echo "OK       $f" || echo "MISSING  $f"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.9
        run: |
          cd "$RUNNER_TEMP"
          curl -fL --retry 5 --retry-all-errors -o gradle.zip \
            https://downloads.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle.zip
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Build
        run: gradle build --no-daemon --stacktrace
